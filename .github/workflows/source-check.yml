name: Hermès Taiwan listing monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/source-check.yml']
permissions:
  contents: write
concurrency:
  group: source-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    # Standard runner on a public repository; no paid runner or saved artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official browser library
        run: npm install --no-save --ignore-scripts puppeteer-core@25.12.0
      - name: Inspect actual public source responses
        env:
          CHROME_HEADLESS: 'false'
        run: xvfb-run --auto-servernum node source-check.mjs
      - name: Publish actual scan for remote dispatch
        run: node publish-scan.mjs
