name: Hermès Taiwan listing monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/source-check.yml']
permissions:
  contents: write
concurrency:
  group: source-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official browser library
        run: npm install --no-save --ignore-scripts puppeteer-core@25.12.0
      - name: Inspect actual public source responses
        run: node source-check.mjs
      - name: Publish actual scan for remote dispatch
        run: |
          git config user.name sarita-monitor
          git config user.email sarita-monitor@users.noreply.github.com
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual listing scan'
            git push origin HEAD:main
          fi
