name: Actual Hermès Taiwan source check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/source-check.yml']
permissions:
  contents: read
concurrency:
  group: source-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official browser library
        run: npm install --no-save --ignore-scripts puppeteer-core@25.12.0
      - name: Inspect actual public source responses
        run: node source-check.mjs
